<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rakesh Boppana - AI & ML Engineer Portfolio</title>
    <!-- Load Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Inter font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet" />
    <style>
        /* Define custom theme colors and font */
        :root {
            --color-primary: #4f46e5; /* indigo-600 */
        }
        
        body {
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
        }

        /* Base styles for scroll animations (equivalent to Framer Motion initial state) */
        .animate-in-hidden {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
        }

        /* Final state triggered by Intersection Observer */
        .animate-in-show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Transition for hover effects */
        .transition-default {
            transition: all 0.3s ease;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-800 antialiased">

    <!-- The main application container will be populated here by JavaScript -->
    <div id="portfolio-root"></div>

    <script>

                github: '#',

                github: '#',

                tags: ['RAG', 'Streamlit', 'LLM'],

            {
                id: 3,
                title: 'AI Image-to-Text App',
                subtitle: 'Google Vision API • OCR • Python',
                description: 'Image-to-text conversion using Google Vision (Lens-based OCR), plus cleanup and export features.',
                github: '#',
                live: '#',
                tags: ['OCR', 'OpenCV', 'Google Vision'],
            },
            {
                id: 4,
                title: 'MCQ Generator',
                subtitle: 'Streamlit • Gemini LLM • MongoDB • PDF export',
                description:
                    'Auto-generates quizzes, evaluates answers, supports admin/student roles and exports results to PDF.',
                github: '#',
                live: '#',
                tags: ['Streamlit', 'MongoDB', 'LLM'],
            },
        ];

        const skills = [
            { name: 'Python', level: 90 },
            { name: 'Machine Learning', level: 85 },

                highlights: [

                ],

                company: 'Corpitsoft',

        // --- 2. STATE SIMULATION (MIGRATED FROM REACT HOOKS) ---

        let isMenuOpen = false;

        // --- 3. HELPER FUNCTIONS (MIGRATED FROM REACT COMPONENTS) ---

        function SectionTitle(title) {
            return `

                    <h3 class="text-3xl font-bold text-gray-900">${title}</h3>
                    <div class="h-1 w-24 bg-indigo-600 rounded mt-2"></div>

        function Stat(label, value) {
            return `

                    <div class="font-semibold mt-1 text-lg text-gray-900">${value}</div>
                </div>
            `;
        }

        function MenuIcon() {
            return `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-900"><line x1="4" x2="20" y1="12" y2="12" /><line x1="4" x2="20" y1="6" y2="6" /><line x1="4" x2="20" y1="18" y2="18" /></svg>`;
        }

        function XIcon() {
            return `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-900"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>`;

        // --- 4. DOM RENDERING FUNCTION ---

            const root = document.getElementById('portfolio-root');
            
            // Generate Project Cards HTML
            const projectsHtml = projects.map(p => `
                <article
                    id="project-${p.id}"
                    class="rounded-3xl p-8 bg-white border border-gray-200 shadow-lg animate-in-hidden"
                    style="transition-delay: ${p.id * 0.1}s;" 
                    onmouseover="this.style.transform='translateY(-5px) scale(1.01)'; this.style.boxShadow='0 10px 15px rgba(99, 102, 241, 0.1)'"

                    <h4 class="text-2xl font-bold text-indigo-600">${p.title}</h4>
                    <p class="text-sm opacity-70 mt-1 text-gray-600">${p.subtitle}</p>
                    <p class="mt-4 text-gray-700">${p.description}</p>
    
                    <div class="mt-5 flex flex-wrap gap-2">
                        ${p.tags.map(t => `<span class="text-xs px-3 py-1 bg-indigo-50 text-indigo-700 rounded-full font-medium border border-indigo-200">${t}</span>`).join('')}

                    <div class="mt-6 flex gap-3">

                        <a href="${p.github}" class="text-sm px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-100 transition-default">Source</a>
                    </div>
                </article>
            `).join('');

            // Generate Skills HTML
            const skillsHtml = skills.map(s => `
                <div class="animate-in-hidden skill-bar" data-level="${s.level}">
                    <div class="flex justify-between items-center text-gray-800">
                        <div class="font-medium text-lg">${s.name}</div>
                        <div class="text-sm opacity-70 text-gray-600">${s.level}%</div>
                    </div>
                    <div class="h-3 bg-gray-200 rounded-full mt-2 overflow-hidden">

            const experienceHtml = experience.map((e, i) => `

                    class="p-8 rounded-3xl bg-white border border-gray-200 shadow-lg relative overflow-hidden animate-in-hidden"
                    style="transition-delay: ${i * 0.2}s;"

                    <div class="flex justify-between items-start pl-0 sm:pl-8">
                        <div class="flex-1">
                            <h5 class="font-bold text-xl text-gray-900">${e.role}</h5>
                            <p class="text-base text-indigo-600 mt-1 mb-3">${e.company}</p>
                            
                            <ul class="mt-4 list-disc ml-5 text-base opacity-80 space-y-2 text-gray-700">
                                ${e.highlights.map(h => `<li>${h}</li>`).join('')}
                            </ul>
                        </div>
                        <div class="text-sm font-medium text-gray-500 flex-shrink-0 ml-4">
                            ${e.duration}
                        </div>
                    </div>
                </div>
            `).join('');


            // Main HTML template (Hero, Projects, Skills, Experience, Contact, Footer)
            root.innerHTML = `
                <header class="max-w-6xl mx-auto px-6 py-6 sticky top-0 z-20 bg-white/95 backdrop-blur-sm border-b border-gray-200">
                    <div class="flex items-center justify-between">
                        <a href="#" class="flex items-center gap-4 group">
                            <div class="w-10 h-10 rounded-full bg-indigo-600 flex items-center justify-center text-white font-bold text-lg transition-default group-hover:rotate-12">RB</div>
                            <div>
                                <h1 class="text-xl font-semibold text-gray-900">Rakesh Boppana</h1>
                                <p class="text-sm opacity-70 text-gray-600">ML Engineer</p>
                            </div>
                        </a>
    
                        <!-- Desktop Navigation -->
                        <nav class="space-x-6 hidden md:block">
                            <a href="#projects" class="text-lg py-2 hover:text-indigo-600 transition-default text-gray-700">Projects</a>
                            <a href="#skills" class="text-lg py-2 hover:text-indigo-600 transition-default text-gray-700">Skills</a>
                            <a href="#experience" class="text-lg py-2 hover:text-indigo-600 transition-default text-gray-700">Experience</a>
                            <a href="#contact" class="text-lg py-2 hover:text-indigo-600 transition-default text-gray-700">Contact</a>
                        </nav>
                        
                        <!-- Mobile Menu Button -->
                        <button id="menu-toggle-open" class="md:hidden p-2 rounded-full hover:bg-gray-100 transition-default focus:outline-none focus:ring-2 focus:ring-indigo-600" aria-label="Open mobile menu">
                            ${MenuIcon()}
                        </button>
                    </div>
                </header>
    
                <!-- Mobile Menu Overlay (Initially hidden) -->
                <nav id="mobile-menu" class="fixed inset-0 z-50 bg-white/95 backdrop-blur-md md:hidden transform translate-x-full transition-transform duration-500 ease-in-out" aria-hidden="true">
                    <div class="p-6 flex justify-between items-center h-20 border-b border-gray-100">
                        <div class="text-xl font-bold text-gray-900">Navigation</div>
                        <button id="menu-toggle-close" class="p-2 rounded-full hover:bg-gray-100 transition-default focus:outline-none focus:ring-2 focus:ring-indigo-600" aria-label="Close mobile menu">
                            ${XIcon()}
                        </button>
                    </div>
                    <div class="flex flex-col space-y-2 p-6">
                        <a href="#projects" class="text-lg py-2 hover:text-indigo-600 transition-default block text-gray-700 menu-link">Projects</a>
                        <a href="#skills" class="text-lg py-2 hover:text-indigo-600 transition-default block text-gray-700 menu-link">Skills</a>
                        <a href="#experience" class="text-lg py-2 hover:text-indigo-600 transition-default block text-gray-700 menu-link">Experience</a>
                        <a href="#contact" class="text-lg py-2 hover:text-indigo-600 transition-default block text-gray-700 menu-link">Contact</a>
                    </div>
                </nav>
    
                <main class="max-w-6xl mx-auto px-6 pb-24">
                    <!-- HERO -->
                    <section class="grid md:grid-cols-2 gap-10 items-center py-12 md:py-24 animate-in-show" role="region" aria-label="Introduction">
                        <div>
                            <h2 class="text-4xl md:text-6xl font-extrabold leading-tight text-gray-900">
                                Hi, I’m <span class="text-indigo-600">Rakesh</span> — building intelligent systems & delightful ML products.
                            </h2>
    
                            <p class="mt-6 text-lg text-gray-600 max-w-2xl">
                                AI graduate experienced in building chatbots, OCR tools, and Streamlit apps that bring machine intelligence to real users. I blend rapid prototyping with production-aware engineering.
                            </p>
    
                            <div class="mt-8 flex gap-3">
                                <a href="#projects" class="inline-flex items-center gap-2 px-6 py-3 bg-indigo-600 text-white rounded-lg font-semibold shadow-lg shadow-indigo-200/50 hover:bg-indigo-700 hover:scale-[1.02] transition-default text-lg">
                                    View Projects
                                </a>
                                <a href="mailto:boppanarakeshchowdary@gmail.com" class="inline-flex items-center gap-2 px-6 py-3 border border-gray-300 rounded-lg text-lg text-gray-700 hover:bg-gray-100 transition-default">
                                    Hire Me
                                </a>
                            </div>
    
                            <div class="mt-10 grid grid-cols-3 gap-4 max-w-md">
                                ${Stat("Experience", "10 yrs (BA ops)")}
                                ${Stat("AI Projects", "6+")}
                                ${Stat("Streamlit Apps", "4")}
                            </div>
                        </div>
    
                        <div class="flex items-center justify-center">
                            <div class="w-full max-w-sm p-6 rounded-3xl bg-white border border-gray-200 shadow-xl">
                                <div class="h-40 bg-gray-100 rounded-xl flex items-center justify-center text-gray-400 italic border border-dashed border-gray-300">
                                    AI/ML Visualization Placeholder
                                </div>
                                <div class="mt-6">
                                    <h3 class="font-semibold text-xl text-gray-900">Featured Project</h3>
                                    <p class="text-sm opacity-70 mt-2 text-gray-600">AI Resume Optimizer — Streamlit app that analyzes and improves resumes with Gemini-powered prompts and PDF parsing.</p>
                                    <div class="mt-4 flex gap-3">
                                        <a class="text-sm px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-default" href="#">Live Link</a>
                                        <a class="text-sm px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-100 transition-default" href="#">GitHub</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>
    
                    <!-- PROJECTS -->
                    <section id="projects" class="py-12 md:py-24" role="region" aria-label="Portfolio Projects">
                        ${SectionTitle("Projects")}
                        <div class="grid md:grid-cols-2 gap-8 mt-6" id="projects-container">
                            ${projectsHtml}
                        </div>
                    </section>
    
                    <!-- SKILLS -->
                    <section id="skills" class="py-12 md:py-24" role="region" aria-label="Skills and Tools">
                        ${SectionTitle("Skills & Tools")}
                        <div class="mt-6 grid md:grid-cols-2 gap-10">
                            <div id="skills-list">
                                <p class="text-base opacity-80 max-w-xl mb-6 text-gray-600 animate-in-hidden">Technical skills with contextual usage. These are the core technologies I utilize to bring AI products to life.</p>
                                <div class="space-y-5">
                                    ${skillsHtml}
                                </div>
                            </div>
    
                            <div class="h-full animate-in-hidden">
                                <div class="p-8 rounded-3xl bg-white border border-gray-200 shadow-xl h-full">
                                    <h4 class="font-bold text-xl mb-4 text-indigo-600">Tool Highlights</h4>
                                    <ul class="space-y-3 text-base opacity-80 list-disc ml-5 text-gray-700">
                                        <li>Google <strong>Gemini API</strong> integrations & advanced prompt engineering</li>
                                        <li><strong>Streamlit</strong> app development for quick ML demos and UIs</li>
                                        <li>OCR pipelines with <strong>Google Vision</strong> & <strong>OpenCV</strong> for document processing</li>

                                    </ul>
                                </div>
                            </div>
                        </div>
                    </section>
    
                    <!-- EXPERIENCE -->
                    <section id="experience" class="py-12 md:py-24" role="region" aria-label="Work Experience">
                        ${SectionTitle("Experience")}
                        <div class="mt-6 space-y-8" id="experience-container">
                            ${experienceHtml}
                        </div>
                    </section>
    
                    <!-- CONTACT -->
                    <section id="contact" class="py-12 md:py-24" role="region" aria-label="Contact Rakesh">
                        ${SectionTitle("Contact")}
                        <div class="mt-6 grid md:grid-cols-2 gap-8">
                            <div class="p-8 rounded-3xl bg-white border border-gray-200 shadow-xl animate-in-hidden">
                                <h4 class="font-bold text-xl text-indigo-600">Get in touch</h4>
                                <p class="text-sm opacity-70 mt-2 text-gray-600">I'm currently seeking roles focused on AI/ML product development. Let's build something intelligent.</p>
    
                                <div class="mt-6 space-y-2 text-gray-800">
                                    <p class="text-base">Email: <span class="text-indigo-600 font-medium">boppanarakeshchowdary@gmail.com</span></p>
                                    <p class="text-base">Phone: <span class="text-indigo-600 font-medium">+91 9493853939</span></p>
                                </div>
    
                                <div class="mt-8 flex gap-3">
                                    <a href="https://www.linkedin.com/in/rakeshboppana/" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-100 transition-default">LinkedIn</a>
                                    <a href="https://github.com/RAKESHle1" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-100 transition-default">GitHub</a>
                                </div>
                            </div>
    
                            <!-- Stateful Contact Form -->
                            <form id="contact-form" class="p-8 rounded-3xl bg-white border border-gray-200 shadow-xl space-y-6 animate-in-hidden">
                                <h4 class="font-bold text-xl text-gray-900">Send a Message</h4>
    
                                <div class="space-y-4">
                                    <div>
                                        <label for="name" class="block text-sm font-medium mb-1 text-gray-700">Name</label>
                                        <input id="name" type="text" class="w-full px-4 py-3 rounded-lg bg-gray-50 border border-gray-300 text-gray-800 focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 transition-default" placeholder="Your name" required />
                                    </div>
    
                                    <div>
                                        <label for="email" class="block text-sm font-medium mb-1 text-gray-700">Email</label>
                                        <input id="email" type="email" class="w-full px-4 py-3 rounded-lg bg-gray-50 border border-gray-300 text-gray-800 focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 transition-default" placeholder="you@mail.com" required />
                                    </div>
    
                                    <div>
                                        <label for="message" class="block text-sm font-medium mb-1 text-gray-700">Message</label>
                                        <textarea id="message" class="w-full px-4 py-3 rounded-lg bg-gray-50 border border-gray-300 text-gray-800 focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 transition-default" rows="4" placeholder="Project inquiry, job opportunity..." required></textarea>
                                    </div>
                                </div>
    
                                <div class="flex justify-end">
                                    <button id="submit-button" type="submit" class="px-6 py-3 rounded-lg text-white font-bold transition-default bg-indigo-600 hover:bg-indigo-700">
                                        Send Message
                                    </button>
                                </div>
                            </form>
                        </div>
                    </section>
    
                    <footer class="mt-12 py-8 text-center border-t border-gray-200 opacity-70 text-gray-600">
                        © ${new Date().getFullYear()} Rakesh Boppana — Built with HTML, Tailwind CSS & Vanilla JS.
                    </footer>
                </main>
    
                <!-- Floating Chat / CTA -->
                <div class="fixed bottom-6 right-6 z-10">
                    <a href="#" class="px-5 py-3 rounded-full bg-red-500 text-white font-semibold shadow-lg shadow-red-300/50 transition-default hover:bg-red-600 hover:scale-[1.05] active:scale-[0.95]">
                        Chat with AI
                    </a>
                </div>
            `;
        }
        
        // --- 5. EVENT LISTENERS AND MAIN LOGIC ---

        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            isMenuOpen = !isMenuOpen;

            if (isMenuOpen) {
                menu.classList.remove('translate-x-full');
                menu.setAttribute('aria-hidden', 'false');
            } else {
                menu.classList.add('translate-x-full');
                menu.setAttribute('aria-hidden', 'true');
            }
        }

        function setupEventListeners() {
            // Mobile Menu Handlers
            document.getElementById('menu-toggle-open').addEventListener('click', toggleMobileMenu);
            document.getElementById('menu-toggle-close').addEventListener('click', toggleMobileMenu);
            
            // Close menu when a navigation link is clicked inside the mobile menu
            document.querySelectorAll('.menu-link').forEach(link => {
                link.addEventListener('click', toggleMobileMenu);
            });

            // Contact Form Handler
            document.getElementById('contact-form').addEventListener('submit', handleFormSubmit);
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            
            const form = e.target;
            const submitButton = document.getElementById('submit-button');

            const name = form.querySelector('#name').value;
            const email = form.querySelector('#email').value;
            const message = form.querySelector('#message').value;

            if (!name || !email || !message) {
                console.error("Validation failed: Please fill out all fields.");
                alert("Please fill out all fields."); 
                return;
            }

            // Start submission state
            isSubmitted = true;
            submitButton.disabled = true;
            submitButton.textContent = 'Sending...';
            submitButton.classList.replace('bg-indigo-600', 'bg-gray-500');
            submitButton.classList.replace('hover:bg-indigo-700', 'hover:bg-gray-500');


            // Mock API call simulation
            console.log('Form Submitted:', { name, email, message });

            setTimeout(() => {
                // End submission state
                isSubmitted = false;
                submitButton.disabled = false;
                submitButton.textContent = 'Send Message';
                submitButton.classList.replace('bg-gray-500', 'bg-indigo-600');
                submitButton.classList.replace('hover:bg-gray-500', 'hover:bg-indigo-700');
                
                // Reset form fields
                form.reset();

                // Non-blocking user feedback
                alert("Thank you for your message, Rakesh will be in touch soon!");
            }, 1500);
        }

        function setupScrollAnimations() {
            const observerOptions = {
                root: null,
                rootMargin: '0px',
                threshold: 0.2 // Trigger when 20% of element is visible
            };

            const observer = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const target = entry.target;
                        target.classList.remove('animate-in-hidden');
                        target.classList.add('animate-in-show');

                        // Special handling for skill bars animation
                        if (target.classList.contains('skill-bar')) {
                            const bar = target.querySelector('div:last-child > div');
                            const width = bar.getAttribute('data-level-width');
                            setTimeout(() => {
                                bar.style.width = width;
                                bar.style.transition = 'width 1.5s ease-out';
                            }, 500); // Delay slightly after fade-in
                        }

                        observer.unobserve(target); // Stop observing once animated
                    }
                });
            }, observerOptions);

            // Observe all elements that should animate
            document.querySelectorAll('.animate-in-hidden').forEach(el => {
                observer.observe(el);
            });
        }


        // Run on window load (equivalent to React mount)
        window.onload = function() {
            renderPortfolio();
            setupEventListeners();
            setupScrollAnimations();
        };

    </script>
</body>
</html>
